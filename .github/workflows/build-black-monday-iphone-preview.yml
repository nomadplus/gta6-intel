name: Build Black Monday iPhone Preview

on:
  push:
    branches:
      - black-monday-iphone-test
    paths:
      - '.github/workflows/build-black-monday-iphone-preview.yml'
      - 'black-monday-preview-src/**'
      - 'black-monday-perf/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_COMMIT: 83700b2c31e593bc94e845b4b31b797be84dda59
      EMSDK_VERSION: 4.0.1
      SEVENZIP_WASM_COMMIT: 521d2cf93f5964f4e77b01049e19f1b29305c454
      SITE_ROOT: public/black-monday
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: black-monday-iphone-test

      - name: Assemble and verify iPhone PWA shell
        run: |
          rm -rf "$SITE_ROOT"
          mkdir -p "$SITE_ROOT/runtime" "$SITE_ROOT/extractor"
          cp black-monday-preview-src/index.html "$SITE_ROOT/index.html"
          cp black-monday-preview-src/styles.css "$SITE_ROOT/styles.css"
          cp black-monday-preview-src/manifest.webmanifest "$SITE_ROOT/manifest.webmanifest"
          cp black-monday-preview-src/sw.js "$SITE_ROOT/sw.js"
          cp black-monday-preview-src/archive-installer-worker.js "$SITE_ROOT/extractor/worker.js"
          cat \
            black-monday-preview-src/appchunk_00 \
            black-monday-preview-src/appchunk_01 \
            black-monday-preview-src/appchunk_02 \
            black-monday-preview-src/appchunk_03 \
            black-monday-preview-src/appchunk_04 \
            black-monday-preview-src/appchunk_05 \
            black-monday-preview-src/appchunk_06 \
            black-monday-preview-src/appchunk_07 \
            black-monday-preview-src/appchunk_08 \
            black-monday-perf/appchunk_09 \
            black-monday-perf/appchunk_10 \
            > "$SITE_ROOT/app.bundle.js"
          test -s "$SITE_ROOT/index.html"
          test -s "$SITE_ROOT/app.bundle.js"
          node --check "$SITE_ROOT/app.bundle.js"
          node --check "$SITE_ROOT/sw.js"
          node --check "$SITE_ROOT/extractor/worker.js"
          grep -q "runtime/Play.js" "$SITE_ROOT/app.bundle.js"
          grep -q "archiveInput" "$SITE_ROOT/app.bundle.js"
          grep -q "extractor/worker.js" "$SITE_ROOT/app.bundle.js"
          grep -q "installBlackMondayDiscReadAhead" "$SITE_ROOT/app.bundle.js"
          grep -q "bmcore-20261003-r33" "$SITE_ROOT/app.bundle.js"
          grep -q "getWasmCodegenModuleCount" "$SITE_ROOT/app.bundle.js"
          if find "$SITE_ROOT" -type f \( -iname '*.iso' -o -iname '*.7z' \) | grep -q .; then
            echo 'Game media was accidentally included in preview bundle.' >&2
            exit 1
          fi

      - name: Vendor pinned browser 7-Zip runtime
        run: |
          BASE="https://raw.githubusercontent.com/use-strict/7z-wasm/$SEVENZIP_WASM_COMMIT"
          curl -fsSL "$BASE/7zz.es6.js" -o "$SITE_ROOT/extractor/7zz.js"
          curl -fsSL "$BASE/7zz.wasm" -o "$SITE_ROOT/extractor/7zz.wasm"
          curl -fsSL "$BASE/License.txt" -o "$SITE_ROOT/extractor/7z-LICENSE.txt"
          node --check "$SITE_ROOT/extractor/7zz.js"
          test "$(stat -c %s "$SITE_ROOT/extractor/7zz.wasm")" -gt 500000
          grep -q 'WORKERFS' "$SITE_ROOT/extractor/7zz.js"

      - name: Smoke-test binary stdout streaming from 7-Zip WASM
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          rm -rf /tmp/bm-7z-smoke
          mkdir -p /tmp/bm-7z-smoke/runtime /tmp/bm-7z-smoke/data
          cp "$SITE_ROOT/extractor/7zz.js" "$SITE_ROOT/extractor/7zz.wasm" /tmp/bm-7z-smoke/runtime/
          printf '{"type":"module"}\n' > /tmp/bm-7z-smoke/runtime/package.json
          dd if=/dev/urandom of=/tmp/bm-7z-smoke/data/payload.iso bs=1M count=4 status=none
          (cd /tmp/bm-7z-smoke/data && 7z a -t7z archive.7z payload.iso >/dev/null)
          cat > /tmp/bm-7z-smoke/runtime/smoke.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import SevenZip from './7zz.js';

          const module = await SevenZip({ noInitialRun: true });
          module.FS.mkdir('/nodefs');
          module.FS.mount(module.NODEFS, { root: '/tmp/bm-7z-smoke/data' }, '/nodefs');
          module.FS.chdir('/nodefs');

          const stdout = module.FS.getStream(1);
          const originalWrite = stdout.stream_ops.write;
          stdout.stream_ops = { ...stdout.stream_ops };
          const hash = crypto.createHash('sha256');
          let bytes = 0;
          let binaryMode = true;
          stdout.stream_ops.write = (stream, buffer, offset, length, position) => {
            if (!binaryMode) return originalWrite(stream, buffer, offset, length, position);
            const chunk = Buffer.from(buffer.subarray(offset, offset + length));
            hash.update(chunk);
            bytes += length;
            return length;
          };

          const exitCode = await module.callMain(['e', 'archive.7z', 'payload.iso', '-so', '-y', '-bsp0', '-bse2']);
          if (exitCode !== 0) throw new Error(`7-Zip smoke extraction exited ${exitCode}`);
          const expected = crypto.createHash('sha256').update(fs.readFileSync('/tmp/bm-7z-smoke/data/payload.iso')).digest('hex');
          const actual = hash.digest('hex');
          if (bytes !== 4 * 1024 * 1024) throw new Error(`stdout stream size mismatch: ${bytes}`);
          if (actual !== expected) throw new Error(`stdout stream hash mismatch: ${actual} != ${expected}`);
          console.log(`7-Zip stdout stream verified: ${bytes} bytes sha256=${actual}`);
          NODE
          node /tmp/bm-7z-smoke/runtime/smoke.mjs

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Install Ninja
        run: |
          sudo apt-get install -y ninja-build

      - name: Checkout pinned Play source
        run: |
          git clone --recurse-submodules https://github.com/jpd002/Play-.git /tmp/play
          git -C /tmp/play checkout --force "$PLAY_COMMIT"
          git -C /tmp/play submodule update --init --recursive --force
          test "$(git -C /tmp/play rev-parse HEAD)" = "$PLAY_COMMIT"

      - name: Apply verified BLACK_MONDAY_WEB transforms
        run: |
          curl -fsSL https://raw.githubusercontent.com/nomadplus/stripe-success-page/black-monday-web-build/black-monday-build/apply_patches.py -o /tmp/apply_patches.py
          curl -fsSL https://raw.githubusercontent.com/nomadplus/stripe-success-page/black-monday-web-build/black-monday-build/apply_renderer_patch.py -o /tmp/apply_renderer_patch.py
          curl -fsSL https://raw.githubusercontent.com/nomadplus/stripe-success-page/black-monday-web-build/black-monday-build/apply_savestate_patch.py -o /tmp/apply_savestate_patch.py
          python3 /tmp/apply_patches.py /tmp/play
          python3 /tmp/apply_renderer_patch.py /tmp/play
          python3 /tmp/apply_savestate_patch.py /tmp/play
          python3 black-monday-perf/apply_runtime_stats_patch.py /tmp/play
          python3 black-monday-perf/apply_wasm_codegen_stats_patch.py /tmp/play
          python3 black-monday-perf/apply_cpp_disc_cache_patch.py /tmp/play
          git -C /tmp/play diff --check
          grep -q 'setPadValue' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'pauseVm' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'setGsResolutionFactor' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'beginLoadState' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'pollLoadState' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'getEeUsagePercent' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'getWasmCodegenModuleCount' /tmp/play/Source/ui_js/Main.cpp
          grep -q 'g_blackMondayWasmModuleMicros' /tmp/play/deps/CodeGen/src/MemoryFunction.cpp
          grep -q 'CACHE_BYTES' /tmp/play/Source/Js_DiscImageDeviceStream.h

      - name: Configure Play WebAssembly
        working-directory: /tmp/play
        run: |
          emcc --version
          emcmake cmake --preset wasm-ninja

      - name: Build Play WebAssembly
        working-directory: /tmp/play
        run: cmake --build --preset wasm-ninja-release --parallel 2

      - name: Stage runtime and verify preview
        run: |
          PLAY_JS="$(find /tmp/play/build_cmake/build/wasm-ninja -type f -path '*/Release/Play.js' -print -quit)"
          PLAY_WASM="$(find /tmp/play/build_cmake/build/wasm-ninja -type f -path '*/Release/Play.wasm' -print -quit)"
          test -n "$PLAY_JS" -a -f "$PLAY_JS"
          test -n "$PLAY_WASM" -a -f "$PLAY_WASM"
          cp "$PLAY_JS" "$SITE_ROOT/runtime/Play.js"
          cp "$PLAY_WASM" "$SITE_ROOT/runtime/Play.wasm"
          node --check "$SITE_ROOT/runtime/Play.js"
          test "$(stat -c %s "$SITE_ROOT/runtime/Play.wasm")" -gt 1000000
          {
            echo "play_commit=$PLAY_COMMIT"
            echo "emsdk_version=$EMSDK_VERSION"
            echo "sevenzip_wasm_commit=$SEVENZIP_WASM_COMMIT"
            echo "preview_source_commit=$GITHUB_SHA"
            echo "built_utc=$(date -u +%FT%TZ)"
            echo "play_js_bytes=$(stat -c %s "$SITE_ROOT/runtime/Play.js")"
            echo "play_wasm_bytes=$(stat -c %s "$SITE_ROOT/runtime/Play.wasm")"
            echo "sevenzip_js_bytes=$(stat -c %s "$SITE_ROOT/extractor/7zz.js")"
            echo "sevenzip_wasm_bytes=$(stat -c %s "$SITE_ROOT/extractor/7zz.wasm")"
            sha256sum \
              "$SITE_ROOT/app.bundle.js" \
              "$SITE_ROOT/runtime/Play.js" \
              "$SITE_ROOT/runtime/Play.wasm" \
              "$SITE_ROOT/extractor/worker.js" \
              "$SITE_ROOT/extractor/7zz.js" \
              "$SITE_ROOT/extractor/7zz.wasm"
          } > "$SITE_ROOT/BUILD_INFO.txt"
          du -sh "$SITE_ROOT"
          find "$SITE_ROOT" -maxdepth 2 -type f | sort

      - name: Commit generated preview runtime
        run: |
          git config user.name 'black-monday-web-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$SITE_ROOT"
          if git diff --cached --quiet; then
            echo 'Preview assets unchanged.'
            exit 0
          fi
          git commit -m 'Build Black Monday iPhone preview runtime [skip preview-build]'
          git push origin HEAD:black-monday-iphone-test
